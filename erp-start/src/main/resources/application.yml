server:
  port: ${SERVER_PORT:1122}
  tomcat:
    accept-count: 2000
    max-connections: 10000

logging:
  level:
    com.xxxx.ddd: INFO

spring:
  application:
    name: hoangminh-pts-auth
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://192.168.100.29:3319/erp-demo?allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database: mysql
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
  jackson:
    serialization:
      indent-output: true
  threads:
    virtual:
      enabled: true
  # Off by default: the default datasource is the team's shared server DB. Only the server backend (docker-compose) and tests migrate.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  # Notification e-mails. Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=<account>, MAIL_PASSWORD=<App Password>.
  # Empty MAIL_HOST = no e-mail is sent (the bell still works).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  # Đính kèm VLDC: 20 MB per file, a topic holds at most 10 files.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 210MB

notification:
  zone: ${NOTIFICATION_ZONE:Asia/Ho_Chi_Minh}
  fresh-hours: ${NOTIFICATION_FRESH_HOURS:24}
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:}
  calendar:
    enabled: ${NOTIFICATION_CALENDAR_ENABLED:true}
    poll-ms: ${NOTIFICATION_CALENDAR_POLL_MS:60000}

# Uploaded VLDC files live on the backend's disk, outside any web root, and are only served through
# /api/vldc/files after a sign-in and scope check. The database keeps their URLs only.
vldc:
  files:
    root: ${VLDC_FILES_ROOT:./data/uploads}

management:
  health:
    # The mail server is optional; an unreachable or unset one must not mark the backend DOWN.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

security:
  jwt:
    base64-secret: ${JWT_BASE64_SECRET:/SGtKxuVt+rk6LLA79sNk9eqScKybeTpW/N9Hx5lm7csNQEUVb1MMciwvXMnh5x4A+qR2YSsq7eqMRHlk+6ZnQ==}
    token-validity-in-seconds: ${JWT_TOKEN_VALIDITY_SECONDS:86400}
    token-validity-in-seconds-for-remember-me: ${JWT_REMEMBER_ME_VALIDITY_SECONDS:2592000}
    refresh-token-validity-in-seconds: ${JWT_REFRESH_VALIDITY_SECONDS:604800}
    refresh-token-validity-in-seconds-for-remember-me: ${JWT_REFRESH_REMEMBER_ME_VALIDITY_SECONDS:2592000}
